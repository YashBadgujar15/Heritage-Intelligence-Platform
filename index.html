      pointer-events: none;

    .gradient-hero::after {
      content: '';

// ── GRANITE API ────────────────────────────────────────────────────
async function callGranite(agentId) {
  setState({ loading: { ...state.loading, [agentId]: true } });

  if (!state.apiKey) {
    await simulateDelay(1800);
    const demoResult = getDemoResult(agentId);
    setState({ loading: { ...state.loading, [agentId]: false }, results: { ...state.results, [agentId]: { text: demoResult, isDemo: true } } });
    return demoResult;
  }

  try {
    const builtPrompt = buildPrompt(agentId);
    const res = await fetch('https://us-south.ml.cloud.ibm.com/ml/v1/text/generation?version=2023-05-29', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` },
      body: JSON.stringify({
        model_id: 'ibm/granite-13b-instruct-v2',
        input: builtPrompt,
        parameters: { decoding_method: 'greedy', max_new_tokens: 800, min_new_tokens: 100, stop_sequences: [], repetition_penalty: 1.1 }
      })
    });
    if (!res.ok) throw new Error('API error: ' + res.status);
    const data = await res.json();
    const text = data?.results?.[0]?.generated_text;
    if (!text) throw new Error('No text in response');
    setState({ graniteConnected: true, loading: { ...state.loading, [agentId]: false }, results: { ...state.results, [agentId]: { text, isDemo: false } } });
    return text;
  } catch (e) {
    await simulateDelay(1800);
    const demoResult = getDemoResult(agentId);
    setState({ loading: { ...state.loading, [agentId]: false }, results: { ...state.results, [agentId]: { text: demoResult, isDemo: true } } });
    return demoResult;
  }
}

// Helper to extract text and demo flag from result
function getResultText(agentId) {
  const r = state.results[agentId];
  if (!r) return null;
  if (typeof r === 'string') return r; // legacy
  return r.text;
}
function isResultDemo(agentId) {
  const r = state.results[agentId];
  if (!r) return true;
  if (typeof r === 'string') return true; // legacy
  return r.isDemo;
}

function buildPrompt(agentId) {
  const siteInfo = state.site ? SITES[state.site] : {};
  if (agentId === 'storytelling') {
    return `You are an expert heritage guide and cultural storyteller. Generate a rich, engaging, and educational heritage narrative in markdown format.

Site: ${siteInfo.name}
Interest: ${state.interest}
Period: ${siteInfo.period}

Write a structured cultural narrative (600-800 words) with sections covering the most relevant historical, architectural, or cultural aspects of this site based on the visitor's interest. Use markdown headers, bold text for key terms, and make it inspiring and informative. Start directly with the content.`;
  }
  if (agentId === 'visitor-flow') {
    const vd = VISITOR_DATA[state.site];
    return `You are a heritage site visitor management expert. Analyse the following data and provide actionable management recommendations in markdown format.

Site: ${siteInfo.name}
Current Load: ${vd.currentLoad}% capacity
Peak Hours: ${vd.peakHour}
Hotspots: ${vd.hotspots.map(h => h.name + ' (' + h.load + '%)').join(', ')}

Generate a visitor flow analysis report with immediate recommendations, crowd management strategies, and a predictive outlook. Be specific and actionable.`;
  }
  if (agentId === 'conservation-report') {
    const cd = CONSERVATION_DATA[state.site];
    return `You are a heritage conservation intelligence system. Synthesise the following monitoring data into a comprehensive conservation report in markdown format.

Site: ${siteInfo.name}
Risk Level: ${siteInfo.riskLevel}
Structural Alerts: ${cd.structuralAlerts.length} (${cd.structuralAlerts.filter(a=>a.severity==='critical').length} critical)
Encroachment Incidents: ${cd.encroachmentAlerts.length} (${cd.encroachmentAlerts.filter(a=>a.severity==='critical').length} critical)
Active Projects: ${cd.conservationProjects.length}

Generate an executive-level conservation intelligence report with risk assessment, priority action matrix, and recommendations. Format for heritage authority decision-making.`;
  }
  return '';
}

function simulateDelay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── DEMO RESULTS ───────────────────────────────────────────────────
function getDemoResult(agentId) {
  const site = state.site;
  const interest = state.interest;

  if (agentId === 'storytelling') return getStorytellingDemo(site, interest);
  if (agentId === 'visitor-flow') return getVisitorFlowDemo(site);
  if (agentId === 'conservation-report') return getConservationReportDemo(site);
  return '';
}

function getStorytellingDemo(site, interest) {
  const stories = {
    'walled-city': {
      history: `## A City Born from Ambition

**Ahmedabad**, founded in 1411 CE by Sultan Ahmad Shah I of the Muzaffarid dynasty, stands as one of India's most extraordinary living heritage cities. The Sultan, having witnessed a hare fearlessly confront his hunting dogs at this bend of the Sabarmati River, took it as an omen of courage — and here he built his capital.

### The Layered Centuries
The Walled City you walk through today is not one city but many — a palimpsest of six centuries. Under the Sultanate, it flourished as a centre of Islamic architecture and Indo-Saracenic synthesis. The Mughal period brought Akbar, who made Ahmedabad a provincial capital and marvelled at its grandeur. Later, the Marathas left their architectural imprint, followed by the British who built beyond the walls but never dismantled the soul within.

### The Pols — Urban Genius
The **pol system** is perhaps the most sophisticated medieval urban planning concept in the subcontinent. These self-contained neighbourhood clusters, each with a single gated entry, internal water wells, shared chowks (squares), and community temples, functioned as independent micro-cities within the city. During communal tensions or floods, a pol could lock its gate and sustain itself for weeks.

### Why This Matters Today
UNESCO recognised Ahmedabad as India's **first World Heritage City** in 2017 — not for any single monument, but for the totality of its urban fabric: the living pols, the jharokha-adorned havelis, the stepwells, the mosques and temples coexisting within metres of each other. This is heritage not frozen in amber, but breathing, adapting, persisting.`,

      architecture: `## Stone, Lime & Light: The Architecture of the Walled City

The built heritage of Ahmedabad represents one of the finest laboratories of **Indo-Saracenic synthesis** — where Islamic spatial principles met Hindu and Jain craft traditions to produce something entirely original.

### Structural Language
The city's mosques demonstrate a masterly adaptation: **Hindu trabeate construction** (post-and-beam) was retained for structural bays while Islamic arcuated forms were applied to facades. The result is buildings that feel simultaneously familiar to both traditions. Notice how columns in the Jama Masjid recall temple pillars yet support pointed arches.

### The Jali — Light Carved in Stone
Nowhere is this synthesis more breathtaking than in the **jali** (lattice screen) work of the Sidi Saiyyed Mosque (1573 CE). The ten stone screens, particularly the famous "Tree of Life," are exercises in impossible delicacy — stone carved to the thinness of lace, with each leaf and tendril structurally self-supporting. Craftsmen believe the master carver wept when he saw it complete, knowing he could never surpass it.

### Haveli Vernacular
The residential architecture of the **pol havelis** follows a consistent deep logic: a narrow street facade (for privacy and shade) opens into an internal courtyard that provides light, ventilation, and social space. Upper floors progressively cantilever over the street on ornate wooden brackets — the **jharokhas** — allowing women to observe street life while maintaining purdah. Every detail is functional: the carved wooden facades minimise solar heat gain on east- and west-facing walls.

### The Conservation Challenge
These structures were built with **lime mortar and teak wood** — materials that breathe, flex, and self-heal to a degree. Modern cement repairs are catastrophic: they are stronger than the original masonry, causing stress fractures as the building moves. Conservation here demands understanding the original material intelligence.`,

      culture: `## The Living Culture of Ahmedabad's Walled City

### A City That Never Sleeps the Same Way Twice
Step into the Walled City at **dawn** and you encounter one city: milkmen on bicycles, the smell of attar and agarbatti from opening temples, the sound of azaan from minarets, old men doing yoga in pol chowks. Return at **midday** and the bazaars are a roaring symphony of textile merchants, silver craftsmen, and street food vendors. At **dusk**, the pols transform into communal living rooms — children playing, elders gossiping, the clatter of home cooking drifting from latticed windows.

### Craft Traditions Still Alive
The Walled City remains a **working craft ecosystem**:
- **Patola weaving** (double-ikat silk) has been practised in Patan for 900 years and traded through Ahmedabad markets
- **Bandhani** (tie-dye) workshops still operate in the Kalupur area using techniques unchanged for 500 years  
- **Rogan art** — the near-extinct Kutchi craft of castor-oil paint on fabric — finds its only trading outlet here
- **Zardozi** embroidery workshops, largely employing Muslim artisans, produce work destined for the finest couture houses globally

### Food as Living Heritage
The Walled City's food culture is itself a UNESCO-worthy phenomenon. **Manek Chowk** transforms nightly from a gold market into a street food carnival. The **Gujarati thali** served in pol homes follows a nutritional philosophy developed over centuries of vegetarian practice — never a random assortment, but a carefully balanced sequence of tastes, textures and temperatures designed to aid digestion.`,

      general: `## Welcome to Ahmedabad's Walled City

You are about to explore one of the world's most extraordinary urban heritage sites — **India's first UNESCO World Heritage City**, a place where 600 years of continuous history is not preserved behind glass but lived, breathed, and negotiated every single day.

### What Makes This Place Special
Unlike heritage sites that are frozen ruins, Ahmedabad's Walled City is **entirely alive**. Over 600,000 people call it home. The same pols (neighbourhood clusters) that housed merchants in the 15th century house their descendants today. The mosques still call for prayer. The havelis still creak with domestic life.

### Three Things You Must Experience
**1. Get Lost in a Pol** — Enter any of the 600+ pols without a map. The disorienting narrowness, the sudden openings into shared courtyards, the ornate wooden facades — this is medieval urban planning at its most sophisticated.

**2. The Jami Masjid at Midday** — The 15th-century mosque with its 260 columns creates a forest of stone that channels and dapples light in ways that feel deliberately meditative.

**3. Manek Chowk After Dark** — By day, a gold and silver market. After 9 PM, Gujarat's most famous street food carnival. The transition happens in real time — watch traders pack up as food stalls unfurl.

### Practical Wisdom
The Walled City rewards **slow, foot-based exploration**. The lanes are too narrow for vehicles and too complex for GPS. Hire a heritage walk guide for your first visit — the stories embedded in every doorway are invisible without context. Best time: October to February, early morning or late evening.`
    },
    'modhera': {
      history: `## The Sun Temple of Modhera: A 1000-Year Chronicle

### The Solanki Moment
In **1026 CE**, the Solanki (Chaulukya) king **Bhimdev I** commissioned a temple to Surya — the Sun God — at Modhera, a site already considered sacred since Vedic times. The Ramayan mentions Modhera as **Dharmaranaya**, the place where Ram performed rites after slaying the demon Ravana. Bhimdev built not merely a temple but a statement of civilisational achievement.

### Why 1026 CE Matters
The year is precise and resonant. It was the same year Mahmud of Ghazni made his seventeenth and final raid into India, looting the Somnath temple on the coast. Bhimdev I, having survived that humiliation, responded not with military power — which he lacked — but with cultural assertion. Modhera was his answer: *we build, therefore we endure.*

### The Temple's Sacred Purpose
The temple was aligned with astronomical precision so that at the **spring and autumn equinoxes**, the first rays of sunrise would pass through successive doorways and strike the central image of Surya directly — a feat of solar engineering achieved without modern instruments. The image itself was reportedly studded with gemstones so arranged that the sunlight created a halo effect. The original image is long gone, but the architecture remains structurally capable of the same alignment today.

### Post-Solanki History
The Solanki dynasty fell to the Delhi Sultanate in the 13th century. The temple was damaged — the main icon removed and worship formally discontinued (the temple was never reconsecrated, which is why the ASI can manage it). It then fell into centuries of quiet witness, visited by travellers including James Forbes who described it in the 18th century as "the most perfect specimen of Hindu architecture I have seen in India."`,

      architecture: `## Decoding Modhera: An Architectural Analysis

### The Three-Part Composition
The Modhera complex is a masterclass in **axial temple planning**. Moving from east to west along the sacred axis, you encounter three distinct but unified components:

**1. Surya Kund (Stepped Tank)** — A 176-step tank (kund) of perfect bilateral symmetry, its descending geometry creating 108 miniature shrines in the steps. The number 108 is cosmologically significant in Hinduism. The kund is not merely utilitarian (for ritual bathing) but a three-dimensional mandala — a geometric diagram of the cosmos — that pilgrims traverse physically as a meditation.

**2. Sabha Mandapa (Assembly Hall)** — The pillared hall where devotees gathered before entering the sanctum. Its 52 pillars represent the weeks of the year in the Solanki calendar system. Each pillar carries narrative reliefs — episodes from the Ramayan, Mahabharat, and the Puranas — turning the hall into a visual library of sacred literature.

**3. Garbhagriha (Sanctum Sanctorum)** — The innermost shrine, now imageless, but architecturally the most sophisticated. The exterior walls are divided into **projecting and receding planes** that create a rhythmic play of light and shadow throughout the day — effectively making the building a sundial that reads differently at every hour.

### The Carving Philosophy
No surface at Modhera is uncarved — yet it never feels chaotic. The Solanki master-builders applied a strict **hierarchical programme**: lowest registers carry celestial maidens (apsaras) and secular scenes; middle registers carry gods and their vehicles; upper registers near the shikhara carry increasingly abstract geometric forms as one approaches the divine. The carving is a cosmological instruction manual in stone.

### Material & Technique
Built entirely of **golden sandstone** quarried from the Deccan, Modhera's warm ochre colour shifts through amber, rose, and honey as the sun moves. The stone was carved after placement — meaning the sculptors worked with the building's light conditions in mind.`,

      culture: `## The Living Spirit of Modhera

### Beyond the Archaeological Monument
The Archaeological Survey of India manages Modhera as a protected monument — no active worship occurs here. Yet Modhera is emphatically not dead. Every January, the site comes alive for the **Modhera Dance Festival (Uttarardh Mahotsav)**, a three-day classical dance festival where performances of Bharatanatyam, Odissi, Kuchipudi, and Kathak are staged against the illuminated temple backdrop. Artists from across India consider it among the most spiritually charged performance venues in the country.

### The Solar Mythology
The cult of Surya (Sun worship) was widespread in medieval Gujarat and Rajasthan. The Solanki kings traced their lineage to the Sun — they were **Suryavanshi** (Solar dynasty). The temple at Modhera was not merely religious infrastructure but dynastic propaganda of the most sophisticated kind: our king is descended from the force that governs all life.

The **equinox alignment** of the temple — where sunrise illuminates the sanctum precisely on the spring and autumn equinoxes — represents a profound integration of astronomy, religion, and architecture that challenged European cathedrals' solar alignments by several centuries.

### The Craftsmen's Legacy
The sculptors of Modhera belonged to a professional class of temple architects called **Sutradharas** — literally "holders of the string" (the string being the measuring cord used in Vastu Shastra, the sacred science of sacred space). Their knowledge was transmitted through hereditary guilds. Some of those craft families still exist in villages near Modhera, though now working primarily in the handicraft market. The Sompura community of temple architects in Gujarat traces direct lineage to Solanki-era builders.`,

      general: `## Modhera Sun Temple: Your Essential Guide

### The First Impression
Nothing quite prepares you for the **Surya Kund** — the great stepped tank that announces the temple complex. Descending from the entrance, you suddenly see it: a perfect square of descending stone steps, each level punctuated by miniature shrines, the geometry so precise it appears computational. At dawn or dusk, the water (when present) mirrors the entire composition, doubling its impact.

### The Golden Hour Rule
Modhera was **designed for sunlight**. The sandstone shifts from pale gold at noon to deep amber at golden hour to rose-grey at dusk. The sculptural reliefs — invisible in flat midday light — spring into sharp relief when the sun is low. Plan to arrive at either sunrise (spectacular, and crowd-free) or 90 minutes before sunset.

### Three Moments That Will Stay With You
**1. Stand at the kund's eastern edge at dawn** — the temple axis frames the sunrise with the Sabha Mandapa and sanctum aligned perfectly. You are standing where 11th-century pilgrims stood for the same view.

**2. Find a quiet pillar in the Sabha Mandapa and study just one panel** — the narrative reliefs contain entire Puranic stories compressed into a few square feet of carved stone. Each panel rewards 10 minutes of attention.

**3. The equinox visit (March 20–21 or Sept 22–23)** — if timing permits, the sunrise alignment for which the temple was built still functions perfectly after 1000 years. The experience is remarkable.

### Practical Information
Modhera is 100km from Ahmedabad (2-hour drive). The nearest town is Mehsana. Allow 3–4 hours for a proper visit. The on-site ASI museum contains recovered sculpture fragments and provides important context for the carvings. A licensed guide is highly recommended — the iconographic programme of the temple is dense and rewards explanation.`
    }
  };

function setState(partial) {
  Object.assign(state, partial);
  render();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (state.showApiModal) renderApiModal(app);

  const nav = renderNav();
  app.appendChild(nav);

  const main = document.createElement('main');
  if (state.view === 'landing') renderLanding(main);
  else if (state.view === 'tourist') renderTourist(main);
  else if (state.view === 'authority') renderAuthority(main);
  else if (state.view === 'agents') renderAgents(main);
  else if (state.view === 'emergency') renderEmergency(main);
  app.appendChild(main);

  renderFooter(app);
}

// ── MARKDOWN RENDERER ──────────────────────────────────────────────
function markdownToHtml(md) {
  if (!md) return '';
  return md
    .replace(/^#{1} (.+)$/gm, '<h1 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;font-weight:700;color:#1c1917;margin:1.25rem 0 0.5rem;">$1</h1>')
    .replace(/^#{2} (.+)$/gm, '<h2 style="font-family:\'Playfair Display\',serif;font-size:1.2rem;font-weight:600;color:#292524;margin:1rem 0 0.4rem;border-bottom:1px solid #e7e5e4;padding-bottom:0.25rem;">$1</h2>')
    .replace(/^#{3} (.+)$/gm, '<h3 style="font-size:0.95rem;font-weight:600;color:#44403c;margin:0.85rem 0 0.3rem;">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:#f5f5f4;padding:1px 5px;border-radius:3px;font-size:0.85em;">$1</code>')
    .replace(/^\| (.+) \|$/gm, (_, row) => {
      const cells = row.split(' | ');
      return '<tr>' + cells.map(c => `<td style="padding:6px 12px;border:1px solid #e7e5e4;font-size:0.8rem;">${c.trim()}</td>`).join('') + '</tr>';
    })
    .replace(/(<tr>.*<\/tr>\n?)+/gs, match => `<table style="border-collapse:collapse;width:100%;margin:0.75rem 0;font-size:0.85rem;">${match}</table>`)
    .replace(/^- (.+)$/gm, '<li style="margin:3px 0;padding-left:4px;">$1</li>')
    .replace(/(<li.*<\/li>\n?)+/gs, match => `<ul style="padding-left:1.25rem;margin:0.5rem 0;list-style:disc;">${match}</ul>`)
    .replace(/^\d+\. (.+)$/gm, '<li style="margin:3px 0;padding-left:4px;">$1</li>')
    .replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid #e7e5e4;margin:1rem 0;"/>')
    .replace(/^⚠️ (.+)$/gm, '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:8px 12px;margin:6px 0;color:#9a3412;font-size:0.85rem;">⚠️ $1</div>')
    .replace(/^✅ (.+)$/gm, '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;margin:6px 0;color:#15803d;font-size:0.85rem;">✅ $1</div>')
    .replace(/\n{2,}/g, '</p><p style="margin:0.5rem 0;">')
    .replace(/^(?!<[hupltd]|<\/|⚠|✅)(.+)$/gm, '<p style="margin:0.4rem 0;line-height:1.7;">$1</p>');
}

function runEmergencySimulation() {
  if (state.emergencyRunning) return;
  setState({ emergencyRunning: true, emergencyStep: 0 });
  const steps = [1, 2, 3, 4, 5, 6, 7];
  const delays = [400, 1200, 2200, 3200, 4200, 5400, 6800];
  steps.forEach((step, i) => {

      setState({ emergencyStep: step });
      if (step === 7) setState({ emergencyRunning: false });
    }, delays[i]);
  });
}

  setState({ emergencyStep: 0, emergencyRunning: false });
